services:
  postgres:
    # Ảnh "bundle0" gồm sẵn PostGIS + pgVector (và pgRouting, h3-pg...).
    # Hỗ trợ cả amd64 lẫn arm64 nên máy Apple Silicon, Intel, Windows đều chạy.
    # Ghim tag đầy đủ để cả nhóm dùng đúng một phiên bản.
    image: imresamu/postgis:17-3.5.3-bundle0-bookworm
    container_name: civicflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: civicflow_dev
      POSTGRES_USER: civicflow
      POSTGRES_PASSWORD: civicflow
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      # Đổi thành "5433:5432" nếu máy đang chạy PostgreSQL khác ở cổng 5432.
      - "5432:5432"
    volumes:
      - civicflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civicflow -d civicflow_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: civicflow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - civicflow_redisdata:/data

volumes:
  civicflow_pgdata:
  civicflow_redisdata:
